name: Prepare release draft (manual)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Base installer build run ID
        required: true
        type: string
      platform_runs:
        description: 'Optional platform run overrides as JSON, e.g. {"windows-x64":"123"}'
        type: string
        default: '{}'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      PLATFORM_RUNS: ${{ inputs.platform_runs }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_SOURCES_FILE: .release-build-sources.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Resolve successful platform builds
        run: node scripts/release.mjs resolve-builds "$BUILD_RUN_ID" "$PLATFORM_RUNS" "$BUILD_SOURCES_FILE"
      - name: Download existing installers (no rebuild)
        run: node scripts/release.mjs download-builds "$BUILD_SOURCES_FILE" downloaded
      - name: Read previous releases
        run: gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > /tmp/releases.json
      - name: Validate installers and release notes
        run: node scripts/release.mjs prepare downloaded /tmp/releases.json
      - name: Create or update draft only
        shell: bash
        run: |
          version=$(node scripts/release.mjs version)
          tag="v$version"
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > /tmp/current-releases.json
          TAG="$tag" node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const release = JSON.parse(readFileSync('/tmp/current-releases.json','utf8')).flat().find(r => r.tag_name === process.env.TAG);
          if (release && !release.draft) throw new Error('This version is already published; increment the version.');
          JS
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --draft --target "$BUILD_SHA" --notes-file release-output/RELEASE_NOTES.md
            gh release upload "$tag" release-output/assets/* --clobber
          else
            gh release create "$tag" release-output/assets/* --draft --target "$BUILD_SHA" --title "Skills Space $version" --notes-file release-output/RELEASE_NOTES.md
          fi
