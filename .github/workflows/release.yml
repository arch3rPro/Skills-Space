name: Prepare release draft (manual)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build installers run ID (all four platforms)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Resolve successful source build
        id: source
        shell: bash
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid build run ID'; exit 1; }
          gh run view "$BUILD_RUN_ID" --json headSha,status,conclusion,event,workflowName > /tmp/build-run.json
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const run = JSON.parse(readFileSync('/tmp/build-run.json','utf8'));
          if (run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'workflow_dispatch' || run.workflowName !== 'Build installers (manual)') throw new Error('Select a successful manual installer build.');
          console.log(`sha=${run.headSha}`);
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Download existing installers (no rebuild)
        run: gh run download "$BUILD_RUN_ID" --pattern 'installers-*' --dir downloaded
      - name: Read previous releases
        run: gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > /tmp/releases.json
      - name: Validate installers and release notes
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/release.mjs prepare downloaded /tmp/releases.json
      - name: Create or update draft only
        shell: bash
        run: |
          version=$(node scripts/release.mjs version)
          tag="v$version"
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > /tmp/current-releases.json
          TAG="$tag" node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const release = JSON.parse(readFileSync('/tmp/current-releases.json','utf8')).flat().find(r => r.tag_name === process.env.TAG);
          if (release && !release.draft) throw new Error('This version is already published; increment the version.');
          JS
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --draft --target "${{ steps.source.outputs.sha }}" --notes-file release-output/RELEASE_NOTES.md
            gh release upload "$tag" release-output/assets/* --clobber
          else
            gh release create "$tag" release-output/assets/* --draft --target "${{ steps.source.outputs.sha }}" --title "Skills Space $version" --notes-file release-output/RELEASE_NOTES.md
          fi
